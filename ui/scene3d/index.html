<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParcelVerify 3D workspace</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17191a}
#wrap{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#eceee9}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
canvas.drag{cursor:grabbing}canvas.hot{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.chip{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;background:#fff;border:0;border-radius:999px;padding:6px 11px;font:600 12px Inter,"Segoe UI",Arial,sans-serif;color:#17191a;box-shadow:0 6px 18px rgba(20,22,20,.16);white-space:nowrap;pointer-events:auto;cursor:pointer;transition:opacity .25s,transform .25s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#b9bdb4;flex:none}
.chip.diff .dot{background:#f5c542}.chip.miss .dot{background:#fff;border:2px dashed #555}.chip.ok .dot{background:#34b36a}.chip.work .dot{background:#4d8fe0}
.chip.sel{background:#17191a;color:#fff}.chip.sel .dot{box-shadow:0 0 0 2px #fff}
.chip.status{background:#f5c542;color:#17191a;font-weight:700}.chip.status.green{background:#34b36a;color:#fff}.chip.status.blue{background:#4d8fe0;color:#fff}.chip.status.dark{background:#17191a;color:#fff}
.chip.small{padding:4px 8px;font-size:11px}
.chip.hidden{opacity:0;pointer-events:none}
.chip:focus-visible,.hud button:focus-visible,.strip button:focus-visible{outline:3px solid #b98318;outline-offset:2px}
.hud{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:3}
.hud button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:16px;cursor:pointer;color:#17191a}
.badge{position:absolute;left:14px;bottom:14px;z-index:3;background:rgba(255,255,255,.94);border-radius:999px;padding:9px 14px;font-size:13px;color:#4c514a;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge b{color:#17191a}
.legend{position:absolute;left:14px;top:14px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;max-width:70%}
.legend span{background:rgba(255,255,255,.94);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.strip{position:absolute;left:0;right:0;bottom:58px;z-index:3;display:flex;gap:6px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border:0;border-radius:12px;background:rgba(255,255,255,.95);padding:7px 10px;font:600 11px Inter,"Segoe UI",Arial,sans-serif;color:#17191a;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.08);display:flex;gap:6px;align-items:center}
.strip button[aria-pressed=true]{background:#17191a;color:#fff}
.strip .n{opacity:.55}
.toast{position:absolute;left:50%;top:16px;z-index:4;transform:translate(-50%,-140%);background:#17191a;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 120px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast b{color:#f5c542}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:24px;text-align:center;color:#4c514a;font-size:14px}
.nogl .fallback{display:flex}.nogl canvas{display:none}
@media (max-width:520px){.chip{font-size:11px;padding:5px 9px}.chip.minor{display:none}.legend{display:none}.badge{font-size:12px}}
@media (prefers-reduced-motion:reduce){.toast,.chip{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0" aria-label="Interactive 3D map. Drag to rotate, scroll or pinch to zoom, select a building to inspect it."></canvas>
  <div id="labels" aria-hidden="false"></div>
  <div class="legend" id="legend"></div>
  <div class="hud">
    <button type="button" id="motion" title="Pause motion" aria-label="Pause motion">❚❚</button>
    <button type="button" id="reset" title="Reset view" aria-label="Reset view">⟲</button>
  </div>
  <div class="strip" id="strip" role="group" aria-label="Map locations"></div>
  <div class="badge" id="badge"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="fallback"><b>3D view is not available in this browser.</b><span>Use the location buttons below the map. Every action still works.</span></div>
</div>
<script type="module">
import * as THREE from './three.module.min.js';

/* ---------- Streamlit bridge (component API v1, no external library) ---------- */
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const nonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const emit=(kind,id)=>send('streamlit:setComponentValue',{value:{type:kind,id,nonce:nonce()},dataType:'json'});
let frameHeight=0;
const setHeight=h=>{if(h!==frameHeight){frameHeight=h;send('streamlit:setFrameHeight',{height:h})}};

/* ---------- Palette taken from the reference: white city, yellow focus, charcoal ---------- */
const C={bg:0xeceee9,ground:0xe3e5df,block:0xf4f4f1,bld:0xfbfbf9,yellow:0xf5c542,black:0x1d1f21,green:0x34b36a,blue:0x4d8fe0,road:0xdfe1db,box:0xc8945c,tape:0xe9d3a8,grey:0xc9ccc4};
const wrap=document.getElementById('wrap'),canvas=document.getElementById('c'),labels=document.getElementById('labels');
const stripEl=document.getElementById('strip'),badgeEl=document.getElementById('badge'),toastEl=document.getElementById('toast'),legendEl=document.getElementById('legend');
let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused=reduce;

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){wrap.classList.add('nogl');}
const scene=new THREE.Scene();
scene.background=new THREE.Color(C.bg);
scene.fog=new THREE.Fog(C.bg,135,230);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,1,500);
const rig={target:new THREE.Vector3(0,0,0),yaw:Math.PI*0.25,pitch:0.68,dist:150,zoom:1,base:58};
if(renderer){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
}
scene.add(new THREE.HemisphereLight(0xffffff,0xd5d8cf,1.55));
const sun=new THREE.DirectionalLight(0xffffff,1.9);
sun.position.set(-40,80,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:10,far:220});sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);

/* ---------- small helpers ---------- */
const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.88,metalness:0,...extra});
const M={ground:mat(C.ground),block:mat(C.block),bld:mat(C.bld),black:mat(C.black,{roughness:.6}),yellow:mat(C.yellow,{roughness:.7}),green:mat(C.green),blue:mat(C.blue),box:mat(C.box),tape:mat(C.tape),wheel:mat(0x2b2d2f),route:mat(C.yellow,{roughness:.5,emissive:0x5a4300,emissiveIntensity:.25}),routeBase:mat(0xd2d5cd),glass:mat(0x9aa3a8,{roughness:.3})};
const box=(w,h,d,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;o.receiveShadow=true;return o};
function rng(seedText){let h=1779033703^seedText.length;for(let i=0;i<seedText.length;i++){h=Math.imul(h^seedText.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tweens=[];
function tween(dur,apply,done){dirty=true;if(reduce||dur<=0){apply(1);done&&done();return}tweens.push({t0:performance.now(),dur,apply,done})}
function runTweens(now){for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];const t=Math.min(1,(now-tw.t0)/tw.dur);tw.apply(ease(t));if(t>=1){tweens.splice(i,1);tw.done&&tw.done()}}}
function disposeTree(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material&&!Object.values(M).includes(n.material)){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{m.map&&m.map.dispose();m.dispose()})}})}

class Poly{
  constructor(points){this.p=points.map(([x,z])=>new THREE.Vector3(x,0,z));this.cum=[0];
    for(let i=1;i<this.p.length;i++)this.cum.push(this.cum[i-1]+this.p[i].distanceTo(this.p[i-1]));this.len=this.cum[this.cum.length-1]}
  at(d){d=Math.max(0,Math.min(this.len,d));let i=1;while(i<this.p.length-1&&this.cum[i]<d)i++;
    const a=this.p[i-1],b=this.p[i],seg=this.cum[i]-this.cum[i-1]||1,t=(d-this.cum[i-1])/seg;
    return{pos:a.clone().lerp(b,t),dir:b.clone().sub(a).normalize()}}
}

/* ---------- labels projected from 3D anchors ---------- */
const chips=[];
function chip(text,cls,anchor,onClick,title){
  const el=document.createElement('button');el.type='button';el.className='chip '+(cls||'');
  el.innerHTML='<span class="dot"></span><span class="t"></span>';el.querySelector('.t').textContent=text;
  if(title)el.title=title;el.setAttribute('aria-label',title||text);
  if(onClick)el.onclick=e=>{e.stopPropagation();onClick()};else el.style.pointerEvents='none';
  labels.append(el);const c={el,anchor,lift:0};chips.push(c);return c}
function clearChips(){chips.splice(0).forEach(c=>c.el.remove())}
const v3=new THREE.Vector3();
function placeChips(){const w=wrap.clientWidth,h=wrap.clientHeight;
  for(const c of chips){v3.copy(c.anchor);v3.y+=c.lift;v3.project(camera);
    const x=(v3.x+1)/2*w,y=(1-v3.y)/2*h;c.el.style.left=x.toFixed(1)+'px';c.el.style.top=y.toFixed(1)+'px';
    c.el.style.visibility=(x<-80||x>w+80||y<-40||y>h+40)?'hidden':'visible'}}

let toastTimer=null;
function toast(html,ms=3600){toastEl.innerHTML=html;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),ms)}

/* ---------- city: a white isometric neighbourhood like the reference ---------- */
const R=5,BLOCK=10,INNER=7.4;
const world=new THREE.Group();scene.add(world);
let cityGroup=null,dynamicGroup=null;
function buildCity(seedText,reserved){
  if(cityGroup){world.remove(cityGroup);disposeTree(cityGroup)}
  cityGroup=new THREE.Group();world.add(cityGroup);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M.ground);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;cityGroup.add(ground);
  const rand=rng(seedText);
  const slabs=[],blds=[],crowns=[],trunks=[];
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
  const put=(arr,x,y,z,w,h,d)=>arr.push(m4.compose(p.set(x,y,z),q,s.set(w,h,d)).clone());
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
    const cx=i*BLOCK,cz=j*BLOCK;put(slabs,cx,.12,cz,INNER,.24,INNER);
    if(reserved.has(i+','+j))continue;
    const r=rand();
    if(r<.14){for(let k=0;k<5;k++){const tx=cx+(rand()-.5)*5.6,tz=cz+(rand()-.5)*5.6,sc=.7+rand()*.6;put(crowns,tx,1.25*sc+.24,tz,sc,sc,sc);put(trunks,tx,.55+.24,tz,.18,.7,.18)}continue}
    const slots=r<.35?[[0,0,5.6,5.6]]:[[-1.75,-1.75,2.9,2.9],[1.75,-1.75,2.9,2.9],[-1.75,1.75,2.9,2.9],[1.75,1.75,2.9,2.9]];
    for(const[ox,oz,mw,md]of slots){
      if(slots.length>1&&rand()<.22){const sc=.6+rand()*.4;put(crowns,cx+ox,1.2*sc+.24,cz+oz,sc,sc,sc);put(trunks,cx+ox,.55+.24,cz+oz,.18,.7,.18);continue}
      const w=mw*(.72+rand()*.26),d=md*(.72+rand()*.26),h=(slots.length>1?1.1:1.6)+Math.pow(rand(),1.6)*(slots.length>1?5:6.5);
      put(blds,cx+ox,.24+h/2,cz+oz,w,h,d);
      if(rand()<.45){const h2=.6+rand()*1.6;put(blds,cx+ox+(rand()-.5)*.4,.24+h+h2/2,cz+oz+(rand()-.5)*.4,w*.55,h2,d*.55)}
      if(rand()<.3){put(blds,cx+ox+w*.36,.24+h+.25,cz+oz-d*.3,.5,.5,.5)}
    }
    if(rand()<.6){const side=rand()<.5?-1:1;for(let k=-1;k<=1;k+=2){const sc=.45;put(crowns,cx+k*2.4,.9+.24,cz+side*3.25,sc,sc,sc);put(trunks,cx+k*2.4,.45+.24,cz+side*3.25,.12,.5,.12)}}
  }
  const inst=(geo,material,arr,shadow=true)=>{if(!arr.length)return;const im=new THREE.InstancedMesh(geo,material,arr.length);arr.forEach((m,k)=>im.setMatrixAt(k,m));im.castShadow=shadow;im.receiveShadow=true;cityGroup.add(im)};
  inst(new THREE.BoxGeometry(1,1,1),M.block,slabs,false);
  inst(new THREE.BoxGeometry(1,1,1),M.bld,blds);
  inst(new THREE.IcosahedronGeometry(1,0),M.bld,crowns);
  inst(new THREE.CylinderGeometry(1,1,1,5),M.bld,trunks);
}

/* ---------- shared objects ---------- */
function makePin(color=C.black){
  const g=new THREE.Group();const m=mat(color,{roughness:.5});
  const head=new THREE.Mesh(new THREE.SphereGeometry(.95,20,14),m);head.position.y=1.5;head.castShadow=true;
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.78,1.4,20),m);tip.rotation.x=Math.PI;tip.position.y=.62;tip.castShadow=true;
  const icon=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),mat(0xffffff,{emissive:0xffffff,emissiveIntensity:.3}));icon.position.y=1.5;icon.rotation.set(.5,.6,0);
  g.add(head,tip,icon);g.userData.icon=icon;return g}
function makeRing(color=C.yellow){const r=new THREE.Mesh(new THREE.RingGeometry(3.1,3.7,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.y=.3;return r}
function makeParcel(){const g=new THREE.Group();const b=box(1.2,.9,1.2,M.box);const t=box(1.22,.92,.24,M.tape);const t2=box(.24,.92,1.22,M.tape);g.add(b,t,t2);return g}
function makeVan(){
  const g=new THREE.Group();
  const body=box(2.6,1.3,1.4,M.black);body.position.y=1.05;
  const cab=box(1,1,1.38,M.black);cab.position.set(1.65,.9,0);
  const glass=box(.05,.5,1.2,M.glass);glass.position.set(2.16,1.1,0);
  const stripe=box(2.62,.22,1.42,M.yellow);stripe.position.y=1.15;
  g.add(body,cab,glass,stripe);
  for(const[x,z]of[[-.8,.7],[-.8,-.7],[1.4,.7],[1.4,-.7]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.3,14),M.wheel);w.rotation.x=Math.PI/2;w.position.set(x,.38,z);g.add(w)}
  const cargo=makeParcel();cargo.scale.setScalar(.75);cargo.position.set(-.4,2.05,0);cargo.visible=false;g.add(cargo);g.userData.cargo=cargo;
  return g}
function arrowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#f5c542';x.beginPath();x.arc(64,64,58,0,Math.PI*2);x.fill();
  x.strokeStyle='#1d1f21';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(42,86);x.lineTo(86,42);x.moveTo(52,42);x.lineTo(86,42);x.lineTo(86,76);x.stroke();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function makeHQ(){const g=new THREE.Group();const b=box(5.4,4.6,5.4,M.black);b.position.y=2.54;const t=box(3.2,1.4,3.2,M.black);t.position.y=5.5;
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6),new THREE.MeshBasicMaterial({map:arrowTexture(),transparent:true}));logo.rotation.x=-Math.PI/2;logo.position.y=6.22;
  const band=box(5.46,.3,5.46,M.yellow);band.position.y=4.2;g.add(b,t,logo,band);return g}
function makeStation(role,look){
  const g=new THREE.Group();let body;const surface=look==='missing'?new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.22,depthWrite:false}):mat(look==='diff'?C.yellow:C.bld);
  if(role==='depot'){body=box(5.6,2.4,4.2,surface);body.position.y=1.44;const roof=box(5.8,.3,4.4,look==='missing'?surface:M.block);roof.position.y=2.75;g.add(roof);
    for(let k=-1;k<=1;k++){const door=box(1.1,1.3,.1,M.black);door.position.set(k*1.7,.9,2.12);if(look!=='missing')g.add(door)}}
  else if(role==='house'){body=box(3.4,2.2,3.4,surface);body.position.y=1.34;const roof=new THREE.Mesh(new THREE.ConeGeometry(2.75,1.6,4),look==='missing'?surface:mat(look==='diff'?C.yellow:C.bld));roof.rotation.y=Math.PI/4;roof.position.y=3.25;roof.castShadow=true;g.add(roof)}
  else{body=box(3.8,3.6,3.8,surface);body.position.y=2.04;const top=box(2.2,1.1,2.2,surface);top.position.y=4.4;g.add(top);
    const wing=box(2,1.8,2.4,surface);wing.position.set(2.6,1.14,.6);g.add(wing)}
  g.add(body);g.userData.surface=surface;g.userData.height=role==='hub'?5:role==='house'?4:3;
  if(look==='missing'){const edges=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),new THREE.LineDashedMaterial({color:0x3b3f3a,dashSize:.35,gapSize:.25}));edges.position.copy(body.position);edges.computeLineDistances();g.add(edges)}
  return g}
function ribbon(poly,material,width=.8,y=.27){
  const g=new THREE.Group();g.userData.segs=[];
  for(let i=1;i<poly.p.length;i++){const a=poly.p[i-1],b=poly.p[i];const m=new THREE.Mesh(new THREE.BoxGeometry(1,.06,width),material);m.receiveShadow=true;
    m.position.set(0,y,0);m.rotation.y=-Math.atan2(b.z-a.z,b.x-a.x);g.add(m);g.userData.segs.push({m,a,b,len:a.distanceTo(b),start:poly.cum[i-1]})}
  g.userData.set=d=>{for(const s of g.userData.segs){const l=Math.max(0,Math.min(s.len,d-s.start));s.m.visible=l>.01;if(!s.m.visible)continue;
    const dir=s.b.clone().sub(s.a).normalize();s.m.scale.x=l+width*.5;s.m.position.set(s.a.x+dir.x*l/2,y,s.a.z+dir.z*l/2)}};
  return g}

/* ---------- picking + camera control ---------- */
const pickables=[];const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
let onPick=null,hovered=null;
function pickAt(cx,cy){const r=canvas.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,true)[0];if(!hit)return null;let o=hit.object;while(o&&!o.userData.pick)o=o.parent;return o}
const pointers=new Map();let downAt=null,moved=0,pinch0=0,zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});downAt={x:e.clientX,y:e.clientY};moved=0;
  if(pointers.size===2){const[a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=rig.zoom}});
canvas.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);
  if(prev){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;prev.x=e.clientX;prev.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(pointers.size===2){const[a,b]=[...pointers.values()];rig.zoom=Math.max(.6,Math.min(3.2,zoom0*Math.hypot(a.x-b.x,a.y-b.y)/(pinch0||1)))}
    else if(moved>5){canvas.classList.add('drag');rig.yaw-=dx*.006;rig.pitch=Math.max(.42,Math.min(1.05,rig.pitch+dy*.003))}
    userMoved=true;return}
  const o=pickAt(e.clientX,e.clientY);if(o!==hovered){hovered=o;canvas.classList.toggle('hot',!!o)}});
const up=e=>{canvas.classList.remove('drag');pointers.delete(e.pointerId);if(downAt&&moved<6&&pointers.size===0){const o=pickAt(e.clientX,e.clientY);if(o&&onPick)onPick(o.userData.pick)}downAt=null};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();rig.zoom=Math.max(.6,Math.min(3.2,rig.zoom*Math.exp(-e.deltaY*.0012)));userMoved=true},{passive:false});

function vanAt(where){if(!cs)return null;if(where==='hq')return{d:-1};const k=cs.objs.findIndex(o=>o.n.id===where);return k<0?{d:-1}:{d:cs.places[k].d}}
const HQ_ROAD=new Poly([HQ_DOOR,[-35,-25]]);
function placeVan(state){// state: {d} distance along route; -1 = parked at HQ
  const v=cs.van;if(state.d<0){v.position.set(HQ_DOOR[0]-1.6,.24,HQ_DOOR[1]-1.2);v.rotation.y=-Math.PI/2;return}
  const at=cs.poly.at(state.d);v.position.copy(at.pos).setY(.24);v.position.x+=-at.dir.z*1.4;v.position.z+=at.dir.x*1.4;v.rotation.y=-Math.atan2(at.dir.z,at.dir.x)}
function driveVan(from,to,dur,done){// along HQ spur + main route
  const total=HQ_ROAD.len;const map=s=>s.d<0?0:total+s.d;const a=map(from),b=map(to);
  tween(dur,k=>{const d=a+(b-a)*k;const v=cs.van;
    if(d<=total){const at=HQ_ROAD.at(d);v.position.copy(at.pos).setY(.24);const dir=b>=a?at.dir:at.dir.clone().negate();v.rotation.y=-Math.atan2(dir.z,dir.x)}
    else{const at=cs.poly.at(d-total);v.position.copy(at.pos).setY(.24);const dir=b>=a?at.dir:at.dir.clone().negate();v.rotation.y=-Math.atan2(dir.z,dir.x)}},()=>{placeVan(to);done&&done()})}

function applyPhase(a,animateIt){

  const anchor=anchorObj?new THREE.Vector3(anchorObj.place.pos.x,anchorObj.g.userData.height+7.4,anchorObj.place.pos.z):new THREE.Vector3(HQ_POS.x,11.4,HQ_POS.z);

  const done=()=>{cs.vanState=view.van};

    const dist=Math.abs((prev.d<0?0:prev.d)-(view.van.d<0?0:view.van.d))+6;driveVan(prev,view.van,Math.min(4200,900+dist*30),done);
    const follow=view.van.d<0?new THREE.Vector3(HQ_POS.x+10,0,HQ_POS.z+10):(anchorObj?anchorObj.place.pos:HQ_POS);flyTo(follow.clone(),1.15,1800);
  }else{placeVan(view.van);done()}

  M.route.color.setHex(a.phase==='closed_ok'?C.green:a.phase==='closed_open'?0x9aa095:C.yellow);
  M.route.emissive.setHex(a.phase==='closed_ok'?0x0b3b20:0x5a4300);
  if(a.phase==='closed_ok'&&animateIt){const last=cs.places[cs.places.length-1];const from=cs.places[cs.journeyIdx];
    if(last&&from){tween(2400,k=>{const d=from.d+(last.d-from.d)*k;cs.journey.userData.set(d);const at=cs.poly.at(d);cs.parcel.position.copy(at.pos).setY(1)});}confetti()}
  else if(a.phase==='closed_ok'){const last=cs.places[cs.places.length-1];if(last){cs.journey.userData.set(last.d);cs.parcel.position.copy(last.road).setY(1)}}
}
const MSG={'check>approve':'Request created · <b>waiting for a supervisor</b>','approve>send':'Approved · <b>ready to send</b>','approve>waiting':'Approved and sent · <b>the van is on its way</b>','send>waiting':'Sent to partner · <b>the van is on its way</b>','check>waiting':'Request sent · <b>the van is on its way</b>','waiting>review':'Partner replied · <b>new evidence is back at HQ</b>','review>finish':'Proof accepted · <b>ready to finish</b>','review>check':'Evidence reviewed · <b>back to checking</b>','review>waiting':'Asked again · <b>the van heads back out</b>','approve>check':'Request rejected · <b>back to checking</b>'};
function confetti(){if(reduce)return;const g=new THREE.Group();dynamicGroup.add(g);const cols=[C.yellow,C.green,0xffffff,C.black];const parts=[];

let selectedId=null;

/* ---------- render loop ---------- */
let last=performance.now();
let dirty=true,lastDraw=0;const markDirty=()=>{dirty=true};['pointerdown','pointermove','wheel','keydown'].forEach(t=>canvas.addEventListener(t,markDirty));new ResizeObserver(markDirty).observe(wrap);
function frame(now){requestAnimationFrame(frame);
  const busy=tweens.length>0||dirty;const lively=!paused&&animate.length>0;
  if(!busy&&(!lively||now-lastDraw<33))return;
  if(!busy&&!lively)return;dirty=false;lastDraw=now;
  const dt=Math.min(.05,(now-last)/1000);last=now;runTweens(now);
  if(!paused){for(let i=animate.length-1;i>=0;i--){const a=animate[i];
    if(a.kind==='bob'){a.o.position.y=a.base+Math.sin(now/420+a.ph)*.35;if(a.o.userData.icon)a.o.userData.icon.rotation.y+=dt*1.4}
    else if(a.kind==='loop'){a.t=(a.t+dt*a.speed)%(a.poly.len+12);const d=Math.min(a.t,a.poly.len);const at=a.poly.at(d);a.o.position.copy(at.pos).setY(.24);a.o.position.x+=-at.dir.z*1.2;a.o.position.z+=at.dir.x*1.2;a.o.rotation.y=-Math.atan2(at.dir.z,at.dir.x)}
    else if(a.kind==='fn'){if(a.fn(now,dt))animate.splice(i,1)}}
    if(cs){cs.parcel.rotation.y+=dt*.8;cs.parcel.position.y=1+Math.sin(now/500)*.15;cs.objs.forEach(o=>{if(o.ring.visible){const s=1+Math.sin(now/300)*.06;o.ring.scale.set(s,s,s)}})}}
  const off=new THREE.Vector3(Math.sin(rig.yaw)*Math.cos(rig.pitch),Math.sin(rig.pitch),Math.cos(rig.yaw)*Math.cos(rig.pitch)).multiplyScalar(rig.dist);
  camera.position.copy(rig.target).add(off);camera.lookAt(rig.target);if(camera.zoom!==rig.zoom){camera.zoom=rig.zoom;camera.updateProjectionMatrix()}
  sun.position.copy(rig.target).add(new THREE.Vector3(-40,80,30));sun.target.position.copy(rig.target);
  if(renderer){renderer.render(scene,camera);placeChips()}
}

let currentSig='';
function signature(a){return JSON.stringify([a.mode,a.case_id,(a.stations||[]).map(s=>[s.id,s.status,s.workflow||'']),(a.cases||[]).map(c=>[c.id,c.bucket]),a.featured])}
window.addEventListener('message',e=>{
  if(e.source!==window.parent||!e.data||e.data.type!=='streamlit:render')return;
  const a=e.data.args.payload||{};
  setHeight(a.height||420);wrap.style.height=(a.height||420)+'px';resize();
  const sig=signature(a);
  if(a.mode==='city'){if(sig!==currentSig){currentSig=sig;cs=null;buildCityMode(a)}dirty=true;return}

    if(fresh){rig.target.copy(home.target).add(new THREE.Vector3(-12,0,-12));rig.zoom=.62;rig.yaw=home.yaw-.5;flyTo(home.target,home.zoom,1500,home.yaw)}
    if(prev&&prev!==a.phase){const prevPhase=prev;cs.vanState=phaseView({...a,phase:prevPhase}).van;applyPhase(a,true);const msg=MSG[prevPhase+'>'+a.phase]||(a.phase==='closed_ok'?'Case verified · <b>journey complete</b>':a.phase==='closed_open'?'Case closed · <b>open questions recorded</b>':'');if(msg)toast(msg)}
    else applyPhase(a,false);
  }else if(cs&&cs.a.phase!==a.phase){const p=cs.a.phase;cs.a=a;applyPhase(a,true);const msg=MSG[p+'>'+a.phase];if(msg)toast(msg)}
  cs.a=a;try{sessionStorage.setItem(store,a.phase)}catch(err){}
  if(a.selected&&a.selected!==selectedId)select(a.selected,true);
  dirty=true;
  badgeEl.innerHTML='<b></b> · ';badgeEl.querySelector('b').textContent=a.shipment||'';badgeEl.append(a.headline||'');
});
