<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:#171a19;font:13px Arial,sans-serif}.map{background:#eeefe9;border-radius:18px;padding:12px 8px}.track{display:flex;gap:8px;overflow-x:auto;padding:8px 6px 16px;scroll-behavior:smooth;scrollbar-color:#a7ab9f transparent}.node{position:relative;flex:0 0 132px;min-height:160px;border:1px solid transparent;border-radius:14px;background:transparent;color:#171a19;padding:12px 8px;cursor:pointer;font:inherit}.node[aria-pressed=true]{background:#fff;border-color:#343a32;box-shadow:0 4px 12px #0001}.node:focus-visible{outline:3px solid #9a7513;outline-offset:-3px}.node strong,.node small{display:block;line-height:1.5}.node small{font-size:10px;color:#5e655b}.number{position:absolute;top:7px;left:9px;font-size:10px;color:#60695a}.stage{height:65px;perspective:500px;display:grid;place-items:center}.cube{width:35px;height:35px;position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-34deg);transition:transform .25s}.node:hover .cube,.node[aria-pressed=true] .cube{transform:translateY(-5px) rotateX(-24deg) rotateY(-24deg)}.face{position:absolute;width:35px;height:35px;border:1px solid #b6beb0;background:#d6ddd0}.front{transform:translateZ(17.5px)}.right{transform:rotateY(90deg) translateZ(17.5px);background:#b9c3b1}.top{transform:rotateX(90deg) translateZ(17.5px);background:#f6f8f2}.difference .front{background:#f4ce49;border-color:#c5a42d}.difference .right{background:#c9a62c}.difference .top{background:#ffe78f}.missing .face{background:#ffffff80;border:2px dashed #7a8272}.badge{font-size:10px;display:inline-block;border-radius:5px;background:#e2e6dc;padding:4px 6px;margin:7px 0}.difference .badge{background:#ffe58a}.missing .badge{background:#f1e9d8}.hint{font-size:11px;color:#5e655b;padding:0 8px 4px}@media(prefers-reduced-motion:reduce){.cube{transition:none}.track{scroll-behavior:auto}}
.commands{display:flex;gap:8px;flex-wrap:wrap;padding:12px 8px 4px;border-top:1px solid #d9ddd1}.commands button{cursor:pointer;min-height:44px;border:1px solid #c8cdbf;background:#fff;color:#20251c;border-radius:9px;padding:8px 12px;font:600 12px Arial}.commands button:first-child{background:#f4ce49;border-color:#d3b13e}.commands button:focus-visible{outline:3px solid #9a7513}.workflow{display:block;font-size:10px;color:#345a36;margin-top:4px}.action .front,.task .front{background:#cbdce9}.action .top,.task .top{background:#e5eef5}.kind{display:block;font-size:9px;color:#686f61;text-transform:uppercase;letter-spacing:1px}.task .cube{transform:rotateX(-24deg) rotateY(-34deg) scale(.9)}
</style></head><body><div class="map"><div class="track" role="group" aria-label="Shipment evidence stages"></div><div class="hint">Records → requests → partner tasks · select to work</div><div class="commands" aria-label="Actions for selected node"></div></div><script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let selected=null;let nodes=[];let compact=false;const track=document.querySelector('.track');
function height(){send('streamlit:setFrameHeight',{height:Math.ceil(document.querySelector('.map').getBoundingClientRect().height)+2})}
function choose(intent){send('streamlit:setComponentValue',{value:{id:selected,intent,nonce:crypto.randomUUID()},dataType:'json'})}
function commands(){const box=document.querySelector('.commands');box.replaceChildren();const node=nodes.find(n=>n.id===selected);(node?.commands||[]).forEach(([intent,label])=>{const button=document.createElement('button');button.textContent=compact?'Open case to '+label.toLowerCase():label;button.dataset.intent=intent;button.onclick=()=>choose(intent);box.append(button)});height()}
function render(){track.replaceChildren();nodes.forEach((node,i)=>{const b=document.createElement('button');b.type='button';b.className='node '+(node.kind||'event')+' '+(node.status==='Difference'?'difference':node.status.startsWith('Missing')?'missing':'');b.dataset.id=node.id;b.setAttribute('aria-pressed',String(node.id===selected));b.setAttribute('aria-label',`${i+1}. ${node.label}: ${node.status}`);b.innerHTML='<span class="number"></span><div class="stage" aria-hidden="true"><div class="cube"><span class="face front"></span><span class="face right"></span><span class="face top"></span></div></div><span class="kind"></span><strong></strong><span class="badge"></span><small></small><span class="workflow"></span>';b.querySelector('.number').textContent=String(i+1).padStart(2,'0');b.querySelector('.kind').textContent=node.kind==='event'?'Source record':node.kind==='action'?'Approval':'Follow-up';b.querySelector('strong').textContent=node.label;b.querySelector('.badge').textContent=node.status;b.querySelector('small').textContent=node.time;b.querySelector('.workflow').textContent=node.workflow||'';b.onclick=()=>{selected=node.id;track.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===selected)));commands();choose(null)};track.append(b)});requestAnimationFrame(()=>{track.querySelector('[aria-pressed=true]')?.scrollIntoView({block:'nearest',inline:'center'});commands()})}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;nodes=e.data.args.nodes;compact=e.data.args.compact;if(!nodes.some(n=>n.id===selected))selected=e.data.args.initial;render()});send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
